<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0D1117">
<meta name="description" content="เกมสั่งการหุ่นยนต์เก็บเลข 6 และ 7 สำหรับห้องเรียน">
<title>KHP Robotic SixSeven</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230D1117'/%3E%3Ccircle cx='22' cy='32' r='13' fill='%233ACFE6'/%3E%3Ccircle cx='44' cy='32' r='13' fill='%23FF3D8B'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230D1117'/%3E%3Ccircle cx='22' cy='32' r='13' fill='%233ACFE6'/%3E%3Ccircle cx='44' cy='32' r='13' fill='%23FF3D8B'/%3E%3C/svg%3E">

<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#0D1117;height:100%;overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
  #root{height:100%}
  #root>div{height:100%!important;border-radius:0!important}
  #rotate{display:none;position:fixed;inset:0;background:#0D1117;color:#E9EEF6;z-index:99;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;
    text-align:center;font-family:'IBM Plex Sans Thai',system-ui,sans-serif}
  #rotate svg{animation:tw 1.6s ease-in-out infinite}
  @keyframes tw{0%,100%{transform:rotate(0)}55%,85%{transform:rotate(-90deg)}}
  @media (orientation:portrait) and (max-width:820px){#rotate{display:flex}}
</style>
</head>
<body>

<!-- ============================================================
     ตั้งค่า Firebase  <<<  แก้ตรงนี้ที่เดียว
     วาง Realtime Database URL ไว้ในเครื่องหมายคำพูด เช่น
     window.KHP_DB_URL = "https://ชื่อโปรเจกต์-default-rtdb.asia-southeast1.firebasedatabase.app";
     ลบ URL ออกให้เหลือ "" = กลับไปโหมดออฟไลน์ ใช้ระบบรหัสส่ง Google Form แทน
     ============================================================ -->
<script>window.KHP_DB_URL = "https://pseudo-roboticgame-4-sciweek-default-rtdb.asia-southeast1.firebasedatabase.app";</script>

<!-- แมพที่แก้เองจากแท็บ "แก้ด่าน"  <<<  วางทับบรรทัดล่างนี้
     null = ใช้แมพมาตรฐานที่มากับเกม -->
<script>window.KHP_MAPS = null;</script>

<!-- รหัสผ่านเข้าโหมดครู เก็บเป็นค่าที่แปลงแล้ว อ่านย้อนกลับไม่ได้
     อยากเปลี่ยนรหัส ให้ขอค่าใหม่มาวางแทน · ปล่อยว่าง = ไม่ล็อก -->
<script>window.KHP_TEACHER_HASH = "16TD42R-1C2XTWF";</script>

<div id="root"></div>
<div id="rotate">
  <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#3ACFE6" stroke-width="1.6">
    <rect x="7" y="2" width="10" height="20" rx="2"/><line x1="10.5" y1="18.6" x2="13.5" y2="18.6"/>
  </svg>
  <div style="font-size:17px;font-weight:700">หมุนจอเป็นแนวนอน</div>
  <div style="font-size:13px;color:#7E8899;line-height:1.7;max-width:280px">
    เกมนี้ต้องเล่นแนวนอน<br>สนามแข่งจะได้กว้างพอมองเห็นทั้งแมพ
  </div>
</div>

@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Press+Start+2P&display=swap');

.khp{
  --field:#2F7D46; --field-alt:#3C9155;
  --stone:#98A2B2; --stone-hi:#CBD4E1; --stone-lo:#5A6474;
  --brick:#A56E58; --brick-hi:#C78F73; --brick-lo:#6B4232;
  --six:#3ACFE6; --six-lo:#1B7E90;
  --seven:#FF3D8B; --seven-lo:#9E1C51;
  --robot:#FFD23F; --robot-lo:#C79A17; --robot-nose:#20262F;
  --ice:#9FD8F5; --ice-hi:#EAF8FF; --ice-lo:#5E9BBF;
  --goal:#F2F5FA;
  --pit:#241A2E; --pit-rim:#4A3A5C;
  --path:#FFF3C4;
  --ink:#0D1117; --panel:#151A22; --panel2:#1D242F; --line:#2C3542;
  --text:#E9EEF6; --muted:#7E8899;
  --ok:#4ADE80;

  font-family:'IBM Plex Sans Thai',system-ui,sans-serif;
  color:var(--text);
  background:var(--ink);
  border-radius:10px;
  overflow:hidden; position:relative;
  display:flex; flex-direction:column;
  height:min(86vh,640px); min-height:440px;
  user-select:none;
}
.pix{font-family:'Press Start 2P',ui-monospace,monospace;}

/* \u0E41\u0E16\u0E1A\u0E1A\u0E19 */
.topbar{
  display:flex; align-items:center; gap:10px;
  padding:7px 12px; background:var(--panel);
  border-bottom:1px solid var(--line); flex-shrink:0;
}
.brand{font-family:'Press Start 2P',monospace; font-size:9px; letter-spacing:.5px;}
.brand b{color:var(--six);} .brand i{color:var(--seven); font-style:normal;}
.tabs{display:flex; gap:4px; margin-left:auto;}
.tab{
  font-size:12px; padding:4px 11px; border-radius:5px; cursor:pointer;
  background:var(--panel2); border:1px solid var(--line); color:var(--muted);
}
.tab.on{background:var(--six); border-color:var(--six); color:var(--ink); font-weight:700;}

/* \u0E1E\u0E37\u0E49\u0E19\u0E17\u0E35\u0E48\u0E2B\u0E25\u0E31\u0E01 3:1 */
.stage{display:flex; gap:8px; padding:8px; flex:1; min-height:0;}
.field{
  flex:3; min-width:0; display:flex; align-items:center; justify-content:center;
  background:var(--panel); border:1px solid var(--line); border-radius:8px;
  padding:8px; position:relative;
}
.arena{width:100%; height:100%; max-height:100%;}
.panel{
  flex:1; min-width:212px; max-width:262px; display:flex; flex-direction:column; gap:6px;
}

/* HUD */
.hud{
  background:var(--panel); border:1px solid var(--line); border-radius:8px;
  padding:8px 9px; display:flex; flex-direction:column; gap:6px; flex-shrink:0;
}
.hudRow{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
.hudLbl{font-size:10px; color:var(--muted);}
.hudVal{font-family:'Press Start 2P',monospace; font-size:13px;}
.bar{height:4px; background:var(--panel2); border-radius:2px; overflow:hidden;}
.bar i{display:block; height:100%; background:var(--ok); transition:width .18s;}
.bar i.warn{background:#FBBF24;} .bar i.over{background:var(--seven);}
.combo{
  font-size:11px; padding:3px 7px; border-radius:4px; text-align:center; font-weight:700;
}
.combo.six{background:rgba(58,207,230,.15); color:var(--six);}
.combo.seven{background:rgba(255,61,139,.15); color:var(--seven);}
.combo.none{background:var(--panel2); color:var(--muted); font-weight:400;}

/* \u0E25\u0E34\u0E2A\u0E15\u0E4C\u0E04\u0E33\u0E2A\u0E31\u0E48\u0E07 */
.listBox{
  flex:1 1 auto; min-height:96px;   /* \u0E01\u0E31\u0E19\u0E16\u0E39\u0E01\u0E1A\u0E35\u0E1A\u0E08\u0E19\u0E21\u0E2D\u0E07\u0E44\u0E21\u0E48\u0E40\u0E2B\u0E47\u0E19\u0E1A\u0E19\u0E08\u0E2D\u0E40\u0E15\u0E35\u0E49\u0E22 */
  background:var(--panel); border:1px solid var(--line);
  border-radius:8px; display:flex; flex-direction:column; overflow:hidden;
}
.listHead{
  font-size:10px; color:var(--muted); padding:6px 9px 4px;
  display:flex; justify-content:space-between; flex-shrink:0;
}
.list{overflow-y:auto; flex:1; padding:0 5px 5px;}
.cmd{
  display:flex; align-items:center; gap:7px; padding:5px 7px; border-radius:5px;
  font-size:12px; cursor:pointer; margin-bottom:2px; background:var(--panel2);
  border:1px solid transparent;
}
.cmd:hover{border-color:var(--line);}
.cmd.sel{border-color:var(--six);}
.cmd.active{background:rgba(255,210,63,.16); border-color:var(--robot);}
.cmd .no{font-size:9px; color:var(--muted); width:15px; flex-shrink:0;}
.cmd .gl{font-size:13px; width:14px; text-align:center; flex-shrink:0;}
.cmd.move .gl{color:var(--robot);} .cmd.turn .gl{color:var(--six);}
.cmd .n{margin-left:auto; font-family:'Press Start 2P',monospace; font-size:10px;}
.rowTools{display:flex; gap:3px; padding:3px 5px 5px; }
.empty{padding:16px 10px; text-align:center; font-size:11px; color:var(--muted); line-height:1.6;}

/* \u0E1B\u0E38\u0E48\u0E21 */
.pads{
  background:var(--panel); border:1px solid var(--line); border-radius:8px;
  padding:7px; display:flex; flex-direction:column; gap:6px; flex-shrink:0;
}
.steps{display:grid; grid-template-columns:repeat(9,1fr); gap:2px;}
.step{
  font-family:'Press Start 2P',monospace; font-size:8px; padding:5px 0; border-radius:3px;
  background:var(--panel2); border:1px solid var(--line); color:var(--muted); cursor:pointer;
}
.step.on{background:var(--robot); border-color:var(--robot); color:var(--ink);}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:5px;}
.btn{
  font-family:'IBM Plex Sans Thai',sans-serif; font-size:12px; font-weight:600;
  padding:8px 6px; border-radius:6px; border:1px solid var(--line);
  background:var(--panel2); color:var(--text); cursor:pointer; transition:.12s;
}
.btn:hover:not(:disabled){border-color:var(--six);}
.btn:disabled{opacity:.35; cursor:not-allowed;}
.btn.sm{font-size:10px; padding:4px 7px;}
.btn.ghost{background:transparent;}
.btn.go{background:var(--six); border-color:var(--six); color:var(--ink); font-weight:700;}
.btn.real{background:var(--seven); border-color:var(--seven); color:#fff; font-weight:700;}
.btn.wide{width:100%;}

/* \u0E17\u0E31\u0E1A\u0E0B\u0E49\u0E2D\u0E19 */
.veil{
  position:absolute; inset:0; background:rgba(13,17,23,.93); border-radius:8px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:9px; padding:22px; text-align:center; z-index:5;
}
.veil h2{font-family:'Press Start 2P',monospace; font-size:15px; margin:0;}
.veil p{font-size:12px; color:var(--muted); max-width:330px; line-height:1.65; margin:0;}
.statGrid{display:flex; gap:16px; flex-wrap:wrap; justify-content:center; margin:2px 0 4px;}
.stat{text-align:center;}
.stat b{display:block; font-family:'Press Start 2P',monospace; font-size:16px;}
.stat span{font-size:10px; color:var(--muted);}
.legend{display:flex; gap:14px; font-size:11px; color:var(--muted); flex-wrap:wrap; justify-content:center;}
.dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; vertical-align:-1px;}

.toast{
  position:absolute; bottom:12px; left:50%; transform:translateX(-50%);
  background:var(--seven); color:#fff; font-size:11px; font-weight:600;
  padding:5px 12px; border-radius:20px; z-index:9; white-space:nowrap;
}

/* \u0E2D\u0E19\u0E34\u0E40\u0E21\u0E0A\u0E31\u0E48\u0E19 */
.numTile{animation:bob 1.9s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.4px)}}
.robot{transition:transform .09s linear;}
.robot.hurt{animation:shake .22s;}
@keyframes shake{25%{transform:translate(2px,0)}75%{transform:translate(-2px,0)}}
.popup{font-family:'Press Start 2P',monospace; animation:rise .85s ease-out forwards; font-weight:400;}
.popup.six{fill:var(--six);} .popup.seven{fill:var(--seven);} .popup.bad{fill:#FF6B6B;}
.popup.goal{fill:var(--goal);}
.goalTile{animation:pulse 1.8s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}
@keyframes rise{0%{opacity:0;transform:translateY(3px)}25%{opacity:1}100%{opacity:0;transform:translateY(-11px)}}
.ghostPath{animation:march 1s linear infinite;}
@keyframes march{to{stroke-dashoffset:-14}}
@media (prefers-reduced-motion:reduce){
  .numTile,.ghostPath,.popup,.robot.hurt{animation:none;}
}

/* \u0E23\u0E2B\u0E31\u0E2A\u0E2A\u0E48\u0E07\u0E04\u0E30\u0E41\u0E19\u0E19 */
.codeBox{
  background:var(--panel2); border:1px solid var(--line); border-radius:8px;
  padding:9px 12px; display:flex; flex-direction:column; gap:6px; align-items:center;
}
.codeLbl{font-size:10px; color:var(--muted);}
.codeVal{
  font-family:'Press Start 2P',monospace; font-size:11px; color:var(--robot);
  word-break:break-all; text-align:center; line-height:1.7; max-width:330px;
}

/* \u0E2B\u0E19\u0E49\u0E32\u0E40\u0E02\u0E49\u0E32\u0E2B\u0E49\u0E2D\u0E07\u0E02\u0E2D\u0E07\u0E19\u0E31\u0E01\u0E40\u0E23\u0E35\u0E22\u0E19 */
.gate{
  position:absolute; inset:0; z-index:20; background:var(--ink);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; padding:18px; overflow-y:auto;
}
.gate.gateTop{z-index:40;}
.gateCard{
  width:100%; max-width:330px; flex-shrink:0;
  background:var(--panel); border:1px solid var(--line);
  border-radius:11px; padding:16px; display:flex; flex-direction:column; gap:9px;
}
.gateRow{display:flex; flex-direction:column; gap:3px;}
.gateRow label{font-size:10px; color:var(--muted);}
.gin{
  background:var(--ink); color:var(--text); border:1px solid var(--line);
  border-radius:6px; padding:9px 10px; font-size:14px; width:100%; box-sizing:border-box;
  font-family:'IBM Plex Sans Thai',sans-serif;
}
.gin:focus{outline:none; border-color:var(--six);}
.gin.big{
  font-family:'Press Start 2P',monospace; font-size:19px; letter-spacing:7px;
  text-align:center; color:var(--robot);
}
.gateErr{font-size:11px; color:var(--seven); line-height:1.6;}

/* \u0E2A\u0E16\u0E32\u0E19\u0E30\u0E01\u0E32\u0E23\u0E2A\u0E48\u0E07\u0E04\u0E30\u0E41\u0E19\u0E19 */
.sendState{font-size:12px; font-weight:700; color:var(--muted); padding:2px 0;}
.sendState.sent{color:var(--ok);}
.sendState.already{color:var(--robot); font-weight:500;}

/* \u0E2B\u0E49\u0E2D\u0E07\u0E2A\u0E14\u0E02\u0E2D\u0E07\u0E04\u0E23\u0E39 */
.tab.room{background:var(--panel2); border-color:var(--robot); color:var(--robot);}
.joinBox{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:11px; font-size:11px; color:var(--muted);
}
.liveWrap{flex:1; display:flex; flex-direction:column; min-height:0; gap:7px;}
.liveHead{display:flex; align-items:center; gap:11px; flex-wrap:wrap; flex-shrink:0;}
.roomCode{display:flex; align-items:baseline; gap:7px;}
.roomCode b{font-family:'Press Start 2P',monospace; font-size:21px; color:var(--robot); letter-spacing:3px;}
.pill{font-size:10px; padding:3px 9px; border-radius:20px; background:var(--panel2); color:var(--muted);}
.pill.live{color:var(--ok);}
.pill.error{color:var(--seven);}
.liveFoot{display:flex; align-items:center; gap:9px; flex-wrap:wrap; flex-shrink:0; padding-top:2px;}

/* \u0E41\u0E16\u0E1A\u0E04\u0E27\u0E1A\u0E04\u0E38\u0E21\u0E02\u0E2D\u0E07\u0E04\u0E23\u0E39 */
.control{
  display:flex; align-items:center; gap:11px; flex-wrap:wrap; flex-shrink:0;
  background:var(--panel2); border:1px solid var(--robot); border-radius:8px; padding:8px 11px;
}
.ctlNow{display:flex; flex-direction:column; gap:1px;}
.ctlNow b{font-size:13px; color:var(--robot);}
.ctlHint{font-size:10px; color:var(--muted); flex:1; min-width:150px;}

/* \u0E09\u0E32\u0E01\u0E23\u0E2D\u0E02\u0E2D\u0E07\u0E19\u0E31\u0E01\u0E40\u0E23\u0E35\u0E22\u0E19 */
.waitDots{display:flex; gap:6px;}
.waitDots i{
  width:7px; height:7px; border-radius:50%; background:var(--six);
  animation:blink 1.3s ease-in-out infinite;
}
.waitDots i:nth-child(2){animation-delay:.18s}
.waitDots i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,100%{opacity:.22}50%{opacity:1}}

.miniBoard{display:flex; flex-direction:column; gap:3px; width:100%; max-width:320px;}
.mbRow{
  display:flex; align-items:center; gap:9px; font-size:11px;
  background:var(--panel2); border-radius:5px; padding:5px 9px;
}
.mbRow .mbWho{flex:1; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.mbRow b{font-family:'Press Start 2P',monospace; font-size:10px;}
.mbRow.me{border:1px solid var(--six); color:var(--six);}
.miniBoard.big .mbRow{font-size:13px; padding:8px 11px;}
.mbRow.top1 b{color:var(--robot);}

/* \u0E2B\u0E19\u0E49\u0E32\u0E41\u0E19\u0E30\u0E19\u0E33\u0E27\u0E34\u0E18\u0E35\u0E40\u0E25\u0E48\u0E19 */
.howto{
  display:flex; gap:14px; flex-wrap:wrap; justify-content:center;
  background:var(--panel2); border:1px solid var(--line); border-radius:8px;
  padding:11px 14px; max-width:600px;
}
.hcol{display:flex; flex-direction:column; gap:3px; font-size:10px; color:var(--muted); text-align:left;}
.hcol b{font-size:11px; color:var(--text); margin-bottom:2px;}

.gatePair{display:flex; gap:8px;}
.gatePair .gateRow{flex:1;}
.tab.home{background:var(--panel2); border-color:var(--muted); color:var(--text);}
.tab.home:hover{border-color:var(--six);}
.roomList{display:flex; flex-direction:column; gap:4px; width:100%; max-width:280px; overflow-y:auto; max-height:210px;}
.roomItem{
  display:flex; align-items:center; gap:12px; padding:7px 12px; border-radius:6px;
  background:var(--panel2); border:1px solid var(--line); color:var(--muted);
  font-family:'IBM Plex Sans Thai',sans-serif; font-size:11px; cursor:pointer; text-align:left;
}
.roomItem:hover{border-color:var(--six);}
.roomItem b{font-family:'Press Start 2P',monospace; font-size:12px; color:var(--robot); letter-spacing:2px;}
.roomItem span{margin-left:auto;}

/* \u0E1B\u0E38\u0E48\u0E21\u0E2A\u0E33\u0E2B\u0E23\u0E31\u0E1A\u0E04\u0E23\u0E39\u0E17\u0E35\u0E48\u0E25\u0E48\u0E32\u0E07\u0E2A\u0E38\u0E14 */
.teacherLink{
  flex-shrink:0;
  background:transparent; border:1px solid var(--line); color:var(--muted);
  font-family:'IBM Plex Sans Thai',sans-serif; font-size:11px;
  padding:7px 20px; border-radius:20px; cursor:pointer;
}
.teacherLink:hover{border-color:var(--seven); color:var(--seven);}

/* \u0E19\u0E31\u0E1A\u0E16\u0E2D\u0E22\u0E2B\u0E25\u0E31\u0E07\u0E01\u0E48\u0E2D\u0E19\u0E40\u0E23\u0E34\u0E48\u0E21\u0E23\u0E2D\u0E1A */
.countdownVeil{background:rgba(13,17,23,.96);}
.bigCount{
  font-family:'Press Start 2P',monospace; font-size:60px; color:var(--robot);
  animation:pop .9s ease-out infinite;
}
@keyframes pop{0%{transform:scale(1);opacity:1}70%{transform:scale(1.16);opacity:.55}100%{transform:scale(1);opacity:1}}

/* \u0E14\u0E39\u0E0B\u0E49\u0E33\u0E01\u0E32\u0E23\u0E40\u0E25\u0E48\u0E19\u0E02\u0E2D\u0E07\u0E19\u0E31\u0E01\u0E40\u0E23\u0E35\u0E22\u0E19 */
.res tr.clickable{cursor:pointer;}
.res tr.clickable:hover td{background:rgba(255,255,255,.07);}
.playIcon{font-size:8px; color:var(--six); margin-left:6px; opacity:.65;}
.replayWrap{flex:1; display:flex; flex-direction:column; min-height:0; gap:8px; padding:8px;}
.replayHead{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap; flex-shrink:0;
  background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 11px;
}
.replayWho{display:block; font-size:14px; color:var(--text);}
.replayScore{text-align:center;}
.replayScore b{display:block; font-family:'Press Start 2P',monospace; font-size:16px;}
.replayBody{flex:1; display:flex; gap:8px; min-height:0;}
.replayField{
  flex:3; min-width:0; display:flex; align-items:center; justify-content:center;
  background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px;
}
.replayField svg{width:100%; height:100%; max-height:100%;}
.replayList{
  flex:1; min-width:180px; max-width:250px; overflow-y:auto;
  background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px;
}
.replayBar{
  display:flex; align-items:center; gap:6px; flex-wrap:wrap; flex-shrink:0;
  background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:7px 10px;
}
.scrub{flex:1; min-width:120px; accent-color:var(--six);}

/* \u0E15\u0E31\u0E27\u0E41\u0E01\u0E49\u0E14\u0E48\u0E32\u0E19 */
.edBar{display:flex; gap:4px; flex-wrap:wrap; flex-shrink:0; margin-bottom:7px;}
.edGrid{flex:1; min-height:0; display:flex; align-items:center; justify-content:center;}
.edGrid svg{width:100%; height:100%; max-height:100%;}
.edCell{fill:transparent; cursor:pointer;}
.edCell:hover{fill:#fff; fill-opacity:.22;}
.palette{display:flex; gap:4px; flex-wrap:wrap; flex-shrink:0; margin-top:7px;}
.pbtn{
  display:flex; align-items:center; gap:5px; font-size:10px; padding:4px 8px; border-radius:5px;
  background:var(--panel2); border:1px solid var(--line); color:var(--muted); cursor:pointer;
  font-family:'IBM Plex Sans Thai',sans-serif;
}
.pbtn.on{border-color:var(--six); color:var(--text);}
.pbtn i{width:10px; height:10px; border-radius:2px; display:block;}
.edStats{
  display:flex; flex-direction:column; gap:3px; font-size:11px; color:var(--muted);
  background:var(--panel2); border-radius:6px; padding:8px 10px;
}
.edStats span{display:flex; justify-content:space-between;}
.edStats b{font-family:'Press Start 2P',monospace; font-size:10px; color:var(--text);}
.edAudit{
  margin-top:9px; display:flex; flex-direction:column; gap:5px; font-size:11px;
  line-height:1.6; overflow-y:auto; max-height:230px;
}
.edErr{color:#FF6B6B;}
.edWarn{color:var(--robot);}
.edOk{color:var(--ok);}
.edPlan{background:var(--panel2); border-radius:6px; padding:8px 10px; color:var(--muted);}
.edPlan b{color:var(--text);}
.edHint{font-size:9px; color:var(--muted); line-height:1.6; margin-top:7px;}
.edHint code{color:var(--robot);}

/* \u0E42\u0E2B\u0E21\u0E14\u0E04\u0E23\u0E39 */
.tab.teach{background:var(--panel2); border-color:var(--seven); color:var(--seven);}
.teacher{display:flex; flex-direction:column; height:100%; min-height:0;}
.tstage{display:flex; gap:8px; padding:8px; flex:1; min-height:0;}
.tcol{
  display:flex; flex-direction:column; min-width:0; min-height:0;
  background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:9px;
  flex:1;
}
.tcol.grow{flex:1.35;}
.paste{
  flex:1; min-height:120px; resize:none; width:100%; box-sizing:border-box;
  background:var(--ink); color:var(--text); border:1px solid var(--line);
  border-radius:6px; padding:8px; font-size:11px; line-height:1.7;
  font-family:ui-monospace,'IBM Plex Sans Thai',monospace;
}
.paste::placeholder{color:var(--muted); opacity:.75;}
.numIn{
  width:56px; background:var(--ink); color:var(--text); border:1px solid var(--line);
  border-radius:5px; padding:3px 7px; font-size:12px; text-align:center;
  font-family:'IBM Plex Sans Thai',sans-serif;
}
.resWrap{flex:1; min-height:0; display:flex; flex-direction:column;}
.res{width:100%; border-collapse:collapse; font-size:11px; display:block; overflow-y:auto; flex:1;}
.res thead th{
  position:sticky; top:0; background:var(--panel); color:var(--muted);
  font-weight:500; font-size:10px; padding:5px 4px; text-align:center;
  border-bottom:1px solid var(--line);
}
.res td{padding:4px; text-align:center; border-bottom:1px solid rgba(255,255,255,.045);}
.res tr.top td{color:var(--robot);}
.res .totalCell{color:var(--ok); font-size:11px;}
.res tr.top .totalCell{color:var(--robot);}
.res tr.cut td{color:#FF8080; background:rgba(255,61,139,.07);}
.res tr.err td{color:var(--muted); font-size:10px;}
.res .pix{font-family:'Press Start 2P',monospace; font-size:10px;}
.resFoot{font-size:10px; color:var(--muted); padding-top:7px; flex-shrink:0;}

@media (max-width:760px){
  .tstage{flex-direction:column;}
  .panel{min-width:172px;}
}

/* \u0E08\u0E2D\u0E41\u0E19\u0E27\u0E19\u0E2D\u0E19\u0E02\u0E2D\u0E07\u0E21\u0E37\u0E2D\u0E16\u0E37\u0E2D\u0E40\u0E15\u0E35\u0E49\u0E22\u0E21\u0E32\u0E01 \u0E1A\u0E35\u0E1A\u0E17\u0E38\u0E01\u0E2D\u0E22\u0E48\u0E32\u0E07\u0E43\u0E2B\u0E49\u0E25\u0E34\u0E2A\u0E15\u0E4C\u0E04\u0E33\u0E2A\u0E31\u0E48\u0E07\u0E21\u0E35\u0E17\u0E35\u0E48\u0E22\u0E37\u0E19 */
@media (max-height:520px){
  .stage{gap:6px; padding:6px;}
  /* \u0E40\u0E1C\u0E37\u0E48\u0E2D\u0E44\u0E27\u0E49\u0E0A\u0E31\u0E49\u0E19\u0E2A\u0E38\u0E14\u0E17\u0E49\u0E32\u0E22: \u0E16\u0E49\u0E32\u0E22\u0E31\u0E07\u0E25\u0E49\u0E19\u0E2D\u0E35\u0E01 \u0E43\u0E2B\u0E49\u0E40\u0E25\u0E37\u0E48\u0E2D\u0E19\u0E14\u0E39\u0E44\u0E14\u0E49 \u0E14\u0E35\u0E01\u0E27\u0E48\u0E32\u0E2B\u0E32\u0E22\u0E44\u0E1B\u0E40\u0E09\u0E22 \u0E46 */
  .panel{min-width:196px; max-width:300px; gap:5px; overflow-y:auto;}

  .hud{flex-direction:row; flex-wrap:wrap; align-items:center; gap:9px; padding:6px 9px;}
  .hud > *{flex:0 0 auto;}
  .hud > div:nth-child(3){flex:1 1 76px; min-width:66px;}
  .hudRow{gap:6px;}
  .hudVal{font-size:11px;}
  .combo{flex:1 1 100%; padding:2px 7px; font-size:10px;}

  .listBox{min-height:78px;}
  .listHead{padding:4px 7px 2px; font-size:9px;}
  .list{padding:0 4px 4px;}
  .cmd{padding:3px 6px; font-size:11px; margin-bottom:1px;}
  .cmd .gl{font-size:11px;}

  .pads{padding:5px; gap:5px;}
  .step{padding:3px 0; font-size:7px;}
  .btn{padding:5px 4px; font-size:11px;}
